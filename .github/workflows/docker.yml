# Checks the code, builds the production Docker image and publishes it to the GitHub Container
# Registry as ghcr.io/<owner>/<repo>. Pushes to main publish `latest` and redeploy Portainer;
# version tags (v1.2.3) publish `1.2.3` and `1.2`; pull requests only build.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Type-check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run types:check
      - run: bun run lint

  image:
    name: Build and publish the image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The public URL for canonical links, Open Graph and the sitemap. Override it with a
          # SITE_URL repository variable.
          build-args: VITE_SITE_URL=${{ vars.SITE_URL || 'https://docs.carp.dk' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redeploy on Portainer
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The webhook of the Portainer stack or service re-pulls `latest` and restarts it. Without the
      # PORTAINER_WEBHOOK_URL secret, this step is skipped and Portainer is updated by hand.
      - name: Trigger the Portainer webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK_URL is not set; skipping the redeploy."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$WEBHOOK"
