A0A20" font-family="'SF Pro'" text-anchor="middle" font-size="13px" style="fill: rgb(122, 10, 32);"><text x="618" y="58.42">in your Flutter app on the iPhone</text></g></g></g></g><g data-cell-id="m1"><g><path d="M 138 108 L 607.76 108" fill="none" stroke="#6b7280" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(107, 114, 128);"/><path d="M 615.76 108 L 607.76 110.67 L 607.76 105.33 Z" fill="#6b7280" stroke="#6b7280" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(107, 114, 128); stroke: rgb(107, 114, 128);"/></g><g><g fill="#3C4043" font-family="'SF Pro'" text-anchor="middle" font-size="15px" style="fill: rgb(60, 64, 67);"><rect fill="#ffffff" stroke="none" x="324" y="80" width="109" height="19" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="378" y="95">(1) get_settings</text></g></g></g><g data-cell-id="m2"><g><path d="M 618 193 L 148.24 193" fill="none" stroke="#c30e32" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(195, 14, 50);"/><path d="M 140.24 193 L 148.24 190.33 L 148.24 195.67 Z" fill="#c30e32" stroke="#c30e32" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(195, 14, 50); stroke: rgb(195, 14, 50);"/></g><g><g fill="#7A0A20" font-family="'SF Pro'" text-anchor="middle" font-size="15px" style="fill: rgb(122, 10, 32);"><rect fill="#ffffff" stroke="none" x="228" y="148" width="302" height="37" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="378" y="163">(2) the settings from the AppleWatchDevice</text><text x="378" y="181">in the deployed study protocol</text></g></g></g><g data-cell-id="n3"><g transform="translate(0.5,0.5)"><rect x="8" y="226" width="260" height="90" rx="9" ry="9" fill="#ffffff" stroke="#8a9099" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(138, 144, 153);"/></g><g><g><text x="138" y="258" fill="#1F2328" font-family="'SF Pro'" font-size="15px" text-anchor="middle" style="fill: rgb(31, 35, 40);"><tspan x="138" y="258">(3) AWARE sensors collect into</tspan><tspan x="138" y="276">the database on the watch</tspan></text></g></g><g data-cell-id="n3s"><g><rect x="8" y="283.69" width="260" height="20.77" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B7280" font-family="'SF Pro'" text-anchor="middle" font-size="13px" style="fill: rgb(107, 114, 128);"><text x="138" y="299.58">also while the phone app is closed</text></g></g></g></g><g data-cell-id="m4"><g><path d="M 138 375 L 607.76 375" fill="none" stroke="#c30e32" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(195, 14, 50);"/><path d="M 615.76 375 L 607.76 377.67 L 607.76 372.33 Z" fill="#c30e32" stroke="#c30e32" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(195, 14, 50); stroke: rgb(195, 14, 50);"/></g><g><g fill="#7A0A20" font-family="'SF Pro'" text-anchor="middle" font-size="15px" style="fill: rgb(122, 10, 32);"><rect fill="#ffffff" stroke="none" x="201" y="331" width="356" height="37" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="378" y="346">(4) compressed chunk files over WatchConnectivity</text><text x="378" y="364">every 15 minutes by default</text></g></g></g><g data-cell-id="n5"><g transform="translate(0.5,0.5)"><rect x="488" y="395" width="260" height="71" rx="7.1" ry="7.1" fill="#ffffff" stroke="#8a9099" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(138, 144, 153);"/></g><g><g><text x="618" y="417" fill="#1F2328" font-family="'SF Pro'" font-size="15px" text-anchor="middle" style="fill: rgb(31, 35, 40);"><tspan x="618" y="417">(5) records become CAMS</tspan><tspan x="618" y="435">Measurements</tspan><tspan x="618" y="453">and go to the data manager</tspan></text></g></g></g><g data-cell-id="note"><g transform="translate(0.5,0.5)"><rect x="8" y="479" width="740" height="44" rx="4.4" ry="4.4" fill="#f4f5f7" stroke="#c9cdd3" pointer-events="all" style="fill: rgb(244, 245, 247); stroke: rgb(201, 205, 211);"/></g><g><g><text x="378" y="497" fill="#3C4043" font-family="'SF Pro'" font-size="14px" text-anchor="middle" style="fill: rgb(60, 64, 67);"><tspan x="378" y="497">The watch app holds no study configuration of its own. The phone sends configuration from the deployed</tspan><tspan x="378" y="514">protocol.</tspan></text></g></g></g></g></g></g></svg>